<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dragon Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <div class="gameOver">Game Over</div>
      <div class="start">Press any key to start the game</div>
      <div class="controls">
        <pre>
Space >> Jump
A >> Left
D >> Right
        </pre>
      </div>
      <div class="dino"></div>
      <div class="scoreContainer">Your Score: 0</div>
      <div class="obstacle"></div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
